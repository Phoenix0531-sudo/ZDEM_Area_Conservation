name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint & tests (uv)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Sync dependencies (frozen)
        run: uv sync --frozen --extra dev

      - name: Required project files
        run: |
          test -f README.md
          test -f LICENSE || test -f LICENSE.md

      - name: Ruff (hard — critical rules)
        run: |
          uv run ruff check . --select E9,F63,F7,F82

      - name: Pytest (hard, tests/ only)
        run: uv run pytest -q tests

      - name: pip-audit (advisory)
        continue-on-error: true
        run: |
          uv run pip install pip-audit
          uv run pip-audit || true
